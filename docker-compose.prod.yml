#           cpus: '0.25'
#           memory: 128M

  # Backup service (optional - runs once daily)
  backup:
    image: postgres:16-alpine
    container_name: pos_backup
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pos_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-pos_production}
      PGHOST: postgres
    volumes:
      - ./backups:/backups
    networks:
      - pos_network
    entrypoint: /bin/sh
    command: >
      -c "
      echo 'Starting backup at' $$(date);
      pg_dump -U $$POSTGRES_USER -h postgres -F c -b -v -f /backups/pos_backup_$$(date +%Y%m%d_%H%M%S).dump $$POSTGRES_DB;
      echo 'Backup completed at' $$(date);
      find /backups -name '*.dump' -mtime +7 -delete;
      echo 'Old backups cleaned';
      "

volumes:
  postgres_data:
    driver: local
    name: pos_postgres_data
  app_logs:
    driver: local
    name: pos_app_logs

networks:
  pos_network:
    driver: bridge
    name: pos_network
    ipam:
      config:
        - subnet: 172.20.0.0/16
