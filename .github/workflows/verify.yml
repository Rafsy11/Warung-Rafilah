name: Verify POS upgrade
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated_ci_password
          POSTGRES_DB: pos_test_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d pos_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint -- --quiet
      - run: npm run typecheck
      - run: npm test
        env:
          POS_TEST_DATABASE_URL: postgres://postgres:isolated_ci_password@127.0.0.1:5432/pos_test_ci
      - run: npm run build
        env:
          JWT_SECRET: ci_build_placeholder
          POSTGRES_PASSWORD: ci_build_placeholder
